# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: churnguard
    runtime: docker
    plan: free
    region: oregon
    repo: https://github.com/aryan732005/ChurnGuard
    branch: main
    dockerfilePath: ./churn-app/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
