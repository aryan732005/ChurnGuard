# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: churnguard
    runtime: docker
    plan: free
    region: oregon
    repo: https://github.com/aryan732005/ChurnGuard
    branch: main
    dockerfilePath: ./churn-app/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: CLERK_PUBLISHABLE_KEY
        value: pk_test_c3R1bm5pbmctYWxwYWNhLTY3LmNsZXJrLmFjY291bnRzLmRldiQ
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://churnguard-lvcf.onrender.com,http://127.0.0.1:8000,http://localhost:8000
