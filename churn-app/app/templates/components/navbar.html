<header class="navbar" id="navbar">
    <div class="container navbar-inner">
        <a href="/" class="brand">ChurnGuard</a>
        <nav class="nav-links" aria-label="Main">
            <a href="/" class="nav-link {% if page == 'home' %}active{% endif %}">Home</a>
            <a href="/predict" class="nav-link {% if page == 'predict' %}active{% endif %}">Demo</a>
            <a href="/dashboard" class="nav-link {% if page == 'dashboard' %}active{% endif %}">Dashboard</a>
            <a href="/insights" class="nav-link {% if page == 'insights' %}active{% endif %}">Insights</a>
            <a href="/experiments" class="nav-link {% if page == 'experiments' %}active{% endif %}">Experiments</a>
            <a href="/retrain" class="nav-link {% if page == 'retrain' %}active{% endif %}">Retrain</a>
            <a href="/docs" class="nav-link {% if page == 'docs' %}active{% endif %}">Docs</a>
            <a href="/about" class="nav-link {% if page == 'about' %}active{% endif %}">About</a>
        </nav>
        <div class="nav-actions">
            <button type="button" class="icon-btn" id="themeToggle" aria-label="Toggle theme">
                <i data-lucide="sun"></i>
            </button>
            <button type="button" class="icon-btn" id="cmdToggle" aria-label="Command palette">
                <i data-lucide="command"></i>
            </button>
            {% if clerk_enabled %}
            <div id="clerk-signed-out" class="clerk-auth-group">
                <a href="/sign-in" class="btn btn-secondary btn-sm">Sign in</a>
                <a href="/sign-up" class="btn btn-primary btn-sm hide-mobile">Sign up</a>
            </div>
            <div id="clerk-signed-in" class="clerk-auth-group hidden">
                <div id="clerk-user-button"></div>
            </div>
            {% endif %}
            <a href="/predict" class="btn btn-primary btn-sm hide-mobile">Try the Demo</a>
        </div>
    </div>
</header>
