<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ChurnGuard{% endblock %} — Customer Churn Prediction</title>
    <meta name="description" content="{% block meta %}Predict customer churn with clarity. Minimal analytics for retention teams.{% endblock %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    {% if clerk_enabled %}
    <meta name="clerk-publishable-key" content="{{ clerk_publishable_key }}">
    {% endif %}
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body>
    {% include "components/navbar.html" %}
    <main class="main">
        {% block content %}{% endblock %}
    </main>
    {% include "components/footer.html" %}
    {% include "components/command_palette.html" %}
    <script src="/static/js/main.js"></script>
    <script src="/static/js/disclosure.js"></script>
    {% if clerk_enabled %}
    <script type="module" src="/static/js/clerk-auth.js"></script>
    {% endif %}
    {% block scripts %}{% endblock %}
</body>
</html>
